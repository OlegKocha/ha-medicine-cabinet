name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.13'
            ha: '2025.1.0'
          - python: '3.14'
            ha: '2026.9.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-test.txt homeassistant==${{ matrix.ha }} pytest-aiohttp aiohttp-session
      - name: Install matching HA frontend
        run: python -c "import json, pathlib, subprocess, sys, homeassistant; p=pathlib.Path(homeassistant.__file__).parent/'components/frontend/manifest.json'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', *json.loads(p.read_text())['requirements']])"
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: python -m pytest -q
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: medicine-cabinet-install-${{ matrix.ha }}
          path: dist/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: git diff --exit-code -- custom_components/medicine_cabinet/frontend
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pip install -r requirements-test.txt homeassistant==2026.9.3 pytest-aiohttp aiohttp-session home-assistant-frontend==20260826.7
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Start disposable local Home Assistant
        run: |
          mkdir -p tmp
          python -m tests.ui_server > tmp/ha-ui.log 2>&1 &
          for attempt in $(seq 1 60); do
            if test -s .ha-test/access.json; then exit 0; fi
            sleep 2
          done
          cat tmp/ha-ui.log
          exit 1
      - run: pnpm test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medicine-cabinet-ui-checks
          path: |
            tmp/ui-*.png
            tmp/qa-*.pdf
            test-results/
